[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptvault"
version = "1.0.0"
description = "Yapay zeka görsellerinin PNG metadata'sını okuyan, etiketleyen ve prompt matrisleri üreten kütüphane"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pillow>=10",
    "python-multipart>=0.0.7",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2"
]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "pillow>=10", "python-multipart>=0.0.7"]

[project.scripts]
promptvault = "promptvault.cli:main"

[tool.setuptools.packages.find]
include = ["promptvault*"]

[tool.setuptools.package-data]
"promptvault.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
